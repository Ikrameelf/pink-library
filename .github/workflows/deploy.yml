
name: Deploy Pink Library to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project
        run: unzip pink-library-iphone.zip -d .

      - name: Install dependencies
        working-directory: pink-library
        run: npm install

      - name: Build application
        working-directory: pink-library
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pink-library/dist

      - uses: actions/deploy-pages@v4
