name: Deploy Pink Library to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project
        run: unzip -o pink-library-iphone.zip -d .

      - name: Add Vite TypeScript declarations
        run: |
          mkdir -p pink-library/src
          cat > pink-library/src/vite-env.d.ts <<'EOF'
          /// <reference types="vite/client" />
          declare module '*.css';
          EOF

      - name: Save extracted project files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pink-library
          if ! git diff --cached --quiet; then
            git commit -m "Add extracted Pink Library app source"
            git push origin HEAD:main
          fi

      - name: Install dependencies
        working-directory: pink-library
        run: npm install

      - name: Build application
        working-directory: pink-library
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pink-library/dist

      - uses: actions/deploy-pages@v4
